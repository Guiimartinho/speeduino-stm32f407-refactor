name: CI/CD - SCG-ECU 2.0

# Consolidated CI/CD workflow for SCG-ECU 2.0 project
# Replaces: build-firmware.yml, codespell.yml, validate-ini.yml, pr-memory-deltas-*.yml
#
# Single-platform focus: STM32F407VGT6 only
# Optimized for modularized ultrathink codebase

on:
  push:
    branches: [ main, master, '*-fixes' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # PlatformIO environment for SCG-ECU 2.0
  PIO_ENV: black_F407VE-EEPROM-SPI
  SKETCHES_REPORTS_PATH: sketches-reports

jobs:
  # ============================================================================
  # JOB 1: BUILD FIRMWARE
  # ============================================================================
  build:
    name: Build Firmware (STM32F407)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build STM32F407 Firmware
      run: platformio run -e ${{ env.PIO_ENV }}

    - name: Check build size
      run: |
        echo "=== Build Size Report ==="
        platformio run -e ${{ env.PIO_ENV }} -t size || true

        # Extract memory usage
        if [ -f .pio/build/${{ env.PIO_ENV }}/firmware.elf ]; then
          arm-none-eabi-size .pio/build/${{ env.PIO_ENV }}/firmware.elf || true
        fi

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-stm32f407-${{ github.sha }}
        path: |
          .pio/build/${{ env.PIO_ENV }}/firmware.bin
          .pio/build/${{ env.PIO_ENV }}/firmware.elf
        retention-days: 30

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info-${{ github.sha }}
        path: |
          .pio/build/${{ env.PIO_ENV }}/*.map
        retention-days: 7

  # ============================================================================
  # JOB 2: MEMORY DELTA REPORT (PRs only)
  # ============================================================================
  # DISABLED: Project uses PlatformIO (not Arduino IDE structure with .ino file)
  # Memory tracking is done via build job output instead
  # Future: Implement PlatformIO-based memory delta tracking
  #
  # memory-report:
  #   name: Memory Usage Report
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #
  #   steps:
  #   - name: Checkout repository
  #     uses: actions/checkout@v4
  #
  #   - name: Build and extract memory usage
  #     run: |
  #       # TODO: Implement PlatformIO memory tracking
  #       # platformio run -e black_F407VE-EEPROM-SPI -t size
  #       echo "Memory tracking not yet implemented for PlatformIO"

  # ============================================================================
  # JOB 3: CODE QUALITY CHECKS
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # -----------------------------------
    # Codespell: Check spelling in code
    # -----------------------------------
    - name: Install codespell
      run: |
        sudo apt-get update
        sudo apt-get install codespell

    - name: Update codespell dictionaries
      run: |
        curl --output-dir /tmp --remote-name https://raw.githubusercontent.com/codespell-project/codespell/master/codespell_lib/data/dictionary.txt
        curl --output-dir /tmp --remote-name https://raw.githubusercontent.com/codespell-project/codespell/master/codespell_lib/data/dictionary_rare.txt

    - name: Run codespell
      continue-on-error: true
      run: |
        if [ -f .github/workflows/codespell-ignored-words.txt ]; then
          codespell --dictionary=/tmp/dictionary.txt --dictionary=/tmp/dictionary_rare.txt --ignore-words=./.github/workflows/codespell-ignored-words.txt --count ./speeduino/
        else
          codespell --dictionary=/tmp/dictionary.txt --dictionary=/tmp/dictionary_rare.txt --count ./speeduino/
        fi

    # -----------------------------------
    # INI Validation: TunerStudio config
    # -----------------------------------
    - name: Validate TunerStudio INI
      uses: hyper-tuner/ini-validate-action@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        filename: reference/speeduino.ini

  # ============================================================================
  # JOB 4: BUILD SUCCESS SUMMARY
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    if: always()

    steps:
    - name: Check build status
      run: |
        echo "=== CI/CD Summary ==="
        echo "Build: ${{ needs.build.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build FAILED"
          exit 1
        fi

        if [ "${{ needs.code-quality.result }}" != "success" ]; then
          echo "Code quality checks failed (non-blocking)"
        fi

        echo "CI/CD passed"
