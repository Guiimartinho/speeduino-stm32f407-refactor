name: CI/CD - SCG-ECU 2.0

# Consolidated CI/CD workflow for SCG-ECU 2.0 project
# Replaces: build-firmware.yml, codespell.yml, validate-ini.yml, pr-memory-deltas-*.yml
#
# Single-platform focus: STM32F407VGT6 only
# Optimized for modularized ultrathink codebase

on:
  push:
    branches: [ main, master, '*-fixes' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # PlatformIO environment for SCG-ECU 2.0
  PIO_ENV: black_F407VE-EEPROM-SPI
  SKETCHES_REPORTS_PATH: sketches-reports

jobs:
  # ============================================================================
  # JOB 1: BUILD FIRMWARE
  # ============================================================================
  build:
    name: Build Firmware (STM32F407)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build STM32F407 Firmware
      run: platformio run -e ${{ env.PIO_ENV }}

    - name: Check build size
      run: |
        echo "=== Build Size Report ==="
        platformio run -e ${{ env.PIO_ENV }} -t size || true

        # Extract memory usage
        if [ -f .pio/build/${{ env.PIO_ENV }}/firmware.elf ]; then
          arm-none-eabi-size .pio/build/${{ env.PIO_ENV }}/firmware.elf || true
        fi

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-stm32f407-${{ github.sha }}
        path: |
          .pio/build/${{ env.PIO_ENV }}/firmware.bin
          .pio/build/${{ env.PIO_ENV }}/firmware.elf
        retention-days: 30

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info-${{ github.sha }}
        path: |
          .pio/build/${{ env.PIO_ENV }}/*.map
        retention-days: 7

  # ============================================================================
  # JOB 2: UNIT TESTS (648 tests - PlatformIO native)
  # ============================================================================
  unit-tests:
    name: Unit Tests (648 tests)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-tests-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-tests-

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Run all unit tests
      run: |
        echo "=== Running 648 Unit Tests (17 test suites) ==="
        echo "Test suites:"
        echo "  - test_refactored_helpers (9 tests)"
        echo "  - test_corrections_massive (35 tests)"
        echo "  - test_decoders_massive (78 tests)"
        echo "  - test_sensors_massive (76 tests)"
        echo "  - test_idle_massive (61 tests)"
        echo "  - test_engineProtection_massive (29 tests)"
        echo "  - test_scheduling_massive (25 tests)"
        echo "  === FASE 1: Core Modules (10 new test suites, 335 tests) ==="
        echo "  - test_led_button_system (50 tests)"
        echo "  - test_init_full (60 tests)"
        echo "  - test_speeduino (40 tests)"
        echo "  - test_timers (30 tests)"
        echo "  - test_updates (25 tests)"
        echo "  - test_auxiliaries (50 tests)"
        echo "  - test_utilities (30 tests)"
        echo "  - test_logger (20 tests)"
        echo "  - test_storage (35 tests)"
        echo "  - test_communication_handler (20 tests)"
        echo ""
        platformio test -e native -v \
          -f test_refactored_helpers \
          -f test_corrections_massive \
          -f test_decoders_massive \
          -f test_sensors_massive \
          -f test_idle_massive \
          -f test_engineProtection_massive \
          -f test_scheduling_massive \
          -f test_led_button_system \
          -f test_init_full \
          -f test_speeduino \
          -f test_timers \
          -f test_updates \
          -f test_auxiliaries \
          -f test_utilities \
          -f test_logger \
          -f test_storage \
          -f test_communication_handler

    - name: Generate test summary
      if: always()
      run: |
        echo "=== Unit Test Summary ===" > test-summary.txt
        echo "Total Tests: 648" >> test-summary.txt
        echo "Test Suites: 17" >> test-summary.txt
        echo "Coverage: Phase 1 Complete (FASE 1 + existing)" >> test-summary.txt
        echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> test-summary.txt
        echo "Commit: ${{ github.sha }}" >> test-summary.txt
        cat test-summary.txt

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.sha }}
        path: |
          test-summary.txt
          .pio/build/native/
        retention-days: 30

  # ============================================================================
  # JOB 3: MEMORY DELTA REPORT (PRs only)
  # ============================================================================
  memory-report:
    name: Memory Usage Delta
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: firmware-stm32f407-${{ github.sha }}

    - name: Extract memory usage from current build
      id: current
      run: |
        echo "=== Extracting Memory Usage ==="

        # Install arm-none-eabi-gcc for size tool
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi

        if [ -f firmware.elf ]; then
          # Extract Flash and RAM usage
          SIZE_OUTPUT=$(arm-none-eabi-size firmware.elf)
          echo "$SIZE_OUTPUT"

          # Parse output (text,data,bss format)
          FLASH=$(echo "$SIZE_OUTPUT" | tail -1 | awk '{print $1+$2}')
          RAM=$(echo "$SIZE_OUTPUT" | tail -1 | awk '{print $2+$3}')

          echo "Flash: $FLASH bytes"
          echo "RAM: $RAM bytes"

          # Save to env
          echo "CURRENT_FLASH=$FLASH" >> $GITHUB_ENV
          echo "CURRENT_RAM=$RAM" >> $GITHUB_ENV
        else
          echo "ERROR: firmware.elf not found"
          exit 1
        fi

    - name: Checkout base branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.base_ref }}
        path: base

    - name: Cache pip dependencies (base)
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-base-${{ hashFiles('**/requirements.txt') }}

    - name: Cache PlatformIO (base)
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-base-${{ hashFiles('**/platformio.ini') }}

    - name: Build base branch for comparison
      run: |
        cd base
        python -m pip install --upgrade pip
        pip install --upgrade platformio
        platformio run -e ${{ env.PIO_ENV }}

    - name: Extract memory usage from base build
      id: base
      run: |
        cd base
        sudo apt-get install -y gcc-arm-none-eabi

        if [ -f .pio/build/${{ env.PIO_ENV }}/firmware.elf ]; then
          SIZE_OUTPUT=$(arm-none-eabi-size .pio/build/${{ env.PIO_ENV }}/firmware.elf)
          echo "$SIZE_OUTPUT"

          FLASH=$(echo "$SIZE_OUTPUT" | tail -1 | awk '{print $1+$2}')
          RAM=$(echo "$SIZE_OUTPUT" | tail -1 | awk '{print $2+$3}')

          echo "Base Flash: $FLASH bytes"
          echo "Base RAM: $RAM bytes"

          echo "BASE_FLASH=$FLASH" >> $GITHUB_ENV
          echo "BASE_RAM=$RAM" >> $GITHUB_ENV
        else
          echo "ERROR: base firmware.elf not found"
          exit 1
        fi

    - name: Calculate memory delta
      id: delta
      run: |
        FLASH_DELTA=$((CURRENT_FLASH - BASE_FLASH))
        RAM_DELTA=$((CURRENT_RAM - BASE_RAM))

        echo "FLASH_DELTA=$FLASH_DELTA" >> $GITHUB_ENV
        echo "RAM_DELTA=$RAM_DELTA" >> $GITHUB_ENV

        # Calculate percentages
        FLASH_MAX=524288  # 512KB
        RAM_MAX=131072    # 128KB

        CURRENT_FLASH_PCT=$((CURRENT_FLASH * 100 / FLASH_MAX))
        CURRENT_RAM_PCT=$((CURRENT_RAM * 100 / RAM_MAX))

        echo "CURRENT_FLASH_PCT=$CURRENT_FLASH_PCT" >> $GITHUB_ENV
        echo "CURRENT_RAM_PCT=$CURRENT_RAM_PCT" >> $GITHUB_ENV

        echo "Memory Delta:"
        echo "  Flash: $FLASH_DELTA bytes ($FLASH_DELTA > 0 ? '+' : '')$FLASH_DELTA"
        echo "  RAM: $RAM_DELTA bytes"

    - name: Comment memory delta on PR
      uses: actions/github-script@v7
      with:
        script: |
          const flashDelta = parseInt(process.env.FLASH_DELTA);
          const ramDelta = parseInt(process.env.RAM_DELTA);
          const currentFlash = parseInt(process.env.CURRENT_FLASH);
          const currentRam = parseInt(process.env.CURRENT_RAM);
          const baseFlash = parseInt(process.env.BASE_FLASH);
          const baseRam = parseInt(process.env.BASE_RAM);
          const flashPct = parseInt(process.env.CURRENT_FLASH_PCT);
          const ramPct = parseInt(process.env.CURRENT_RAM_PCT);

          const flashEmoji = flashDelta > 0 ? '📈' : flashDelta < 0 ? '📉' : '➡️';
          const ramEmoji = ramDelta > 0 ? '📈' : ramDelta < 0 ? '➡️' : '➡️';
          const flashSign = flashDelta > 0 ? '+' : '';
          const ramSign = ramDelta > 0 ? '+' : '';

          // Check budgets (Flash <45%, RAM <20%)
          const flashWarning = flashPct >= 45 ? ' ⚠️ **OVER BUDGET**' : '';
          const ramWarning = ramPct >= 20 ? ' ⚠️ **OVER BUDGET**' : '';

          const body = `## 💾 Memory Usage Report

          | Metric | Base | Current | Delta | % Used |
          |--------|------|---------|-------|--------|
          | **Flash** ${flashEmoji} | ${baseFlash.toLocaleString()} bytes | ${currentFlash.toLocaleString()} bytes | ${flashSign}${flashDelta.toLocaleString()} bytes | ${flashPct}% / 512KB${flashWarning} |
          | **RAM** ${ramEmoji} | ${baseRam.toLocaleString()} bytes | ${currentRam.toLocaleString()} bytes | ${ramSign}${ramDelta.toLocaleString()} bytes | ${ramPct}% / 128KB${ramWarning} |

          **Target Budgets:**
          - Flash: < 45% (< 235,929 bytes) ${flashPct < 45 ? '✅' : '❌'}
          - RAM: < 20% (< 26,214 bytes) ${ramPct < 20 ? '✅' : '❌'}

          <details>
          <summary>Memory Budget Guidelines</summary>

          - Keep Flash usage below 45% for future features
          - Keep RAM usage below 20% for stack/heap safety
          - Large Flash increases (>5KB) should be justified
          - Any RAM increase should be carefully reviewed
          </details>`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Check memory budget thresholds
      run: |
        echo "=== Memory Budget Check ==="
        FLASH_PCT=${{ env.CURRENT_FLASH_PCT }}
        RAM_PCT=${{ env.CURRENT_RAM_PCT }}

        echo "Flash usage: $FLASH_PCT% (budget: <45%)"
        echo "RAM usage: $RAM_PCT% (budget: <20%)"

        FAIL=0
        if [ "$FLASH_PCT" -ge 45 ]; then
          echo "❌ Flash usage exceeds budget (${FLASH_PCT}% >= 45%)"
          FAIL=1
        else
          echo "✅ Flash usage within budget"
        fi

        if [ "$RAM_PCT" -ge 20 ]; then
          echo "❌ RAM usage exceeds budget (${RAM_PCT}% >= 20%)"
          FAIL=1
        else
          echo "✅ RAM usage within budget"
        fi

        if [ "$FAIL" -eq 1 ]; then
          echo ""
          echo "Memory budget exceeded! Please optimize before merging."
          exit 1
        fi

  # ============================================================================
  # JOB 4: CODE QUALITY CHECKS
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # -----------------------------------
    # Codespell: Check spelling in code
    # -----------------------------------
    - name: Install codespell
      run: |
        sudo apt-get update
        sudo apt-get install codespell

    - name: Update codespell dictionaries
      run: |
        curl --output-dir /tmp --remote-name https://raw.githubusercontent.com/codespell-project/codespell/master/codespell_lib/data/dictionary.txt
        curl --output-dir /tmp --remote-name https://raw.githubusercontent.com/codespell-project/codespell/master/codespell_lib/data/dictionary_rare.txt

    - name: Run codespell
      continue-on-error: true
      run: |
        if [ -f .github/workflows/codespell-ignored-words.txt ]; then
          codespell --dictionary=/tmp/dictionary.txt --dictionary=/tmp/dictionary_rare.txt --ignore-words=./.github/workflows/codespell-ignored-words.txt --count ./speeduino/
        else
          codespell --dictionary=/tmp/dictionary.txt --dictionary=/tmp/dictionary_rare.txt --count ./speeduino/
        fi

    # -----------------------------------
    # INI Validation: TunerStudio config
    # -----------------------------------
    - name: Validate TunerStudio INI
      uses: hyper-tuner/ini-validate-action@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        filename: reference/speeduino.ini

  # ============================================================================
  # JOB 5: BUILD SUCCESS SUMMARY
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, unit-tests, code-quality]
    if: always()

    steps:
    - name: Check build status
      run: |
        echo "=== CI/CD Summary ==="
        echo "Build: ${{ needs.build.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"

        FAILED=0

        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "❌ Build FAILED"
          FAILED=1
        else
          echo "✅ Build SUCCESS"
        fi

        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit Tests FAILED (648 tests)"
          FAILED=1
        else
          echo "✅ Unit Tests PASSED (648 tests)"
        fi

        if [ "${{ needs.code-quality.result }}" != "success" ]; then
          echo "⚠️  Code quality checks failed (non-blocking)"
        else
          echo "✅ Code Quality PASSED"
        fi

        if [ "$FAILED" -eq 1 ]; then
          echo ""
          echo "CI/CD FAILED - Please fix errors above"
          exit 1
        fi

        echo ""
        echo "✅ CI/CD PASSED - All checks successful!"
