name: Documentation - SCG-ECU 2.0

# Automatic Doxygen documentation generation and deployment
# Publishes to GitHub Pages for easy access
#
# Adapted for SCG-ECU 2.0:
# - Uses GitHub Pages in same repo (not separate repo)
# - Simplified deployment process
# - Automatic updates on master/main push

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Doxygen documentation
      uses: mattnotmitt/doxygen-action@v1.9
      with:
        doxyfile-path: "./Doxyfile"
        working-directory: "."

    - name: Verify documentation built
      run: |
        if [ -d "reference/doxygen/html" ]; then
          echo "Documentation built successfully"
          ls -la reference/doxygen/html/
        else
          echo "ERROR: Documentation directory not found"
          exit 1
        fi

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: doxygen-docs-${{ github.sha }}
        path: reference/doxygen/html/
        retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download documentation artifact
      uses: actions/download-artifact@v4
      with:
        name: doxygen-docs-${{ github.sha }}
        path: ./docs-html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact to Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs-html'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Summary
      run: |
        echo "Documentation deployed to GitHub Pages"
        echo "URL: ${{ steps.deployment.outputs.page_url }}"
