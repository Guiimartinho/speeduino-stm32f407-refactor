; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

;STM32 Official core
[env:black_F407VE]
platform = ststm32
framework = arduino
board = black_f407ve
; RTC library fixed to 1.2.0, because in newer than that the RTC fails to keep up time. At least up to 1.3.7 version
lib_deps = stm32duino/STM32duino RTC @ 1.2.0, greiman/SdFat, SimplyAtomic, elapsedMillis
board_build.core = stm32
build_flags = -DUSE_LIBDIVIDE -std=c++14 -UBOARD_MAX_IO_PINS -DENABLE_HWSERIAL2 -DENABLE_HWSERIAL3 -DUSBCON -DHAL_PCD_MODULE_ENABLED -DUSBD_USE_CDC -DHAL_CAN_MODULE_ENABLED -DSERIAL_TX_BUFFER_SIZE=128 -DSERIAL_RX_BUFFER_SIZE=128
upload_protocol = dfu
debug_tool = stlink
monitor_speed = 115200

; For testing only
[env:black_F407VE-EEPROM-SRAM]
extends = env:black_F407VE
build_flags = ${env:black_F407VE.build_flags} -DSRAM_AS_EEPROM
; For testing only
[env:black_F407VE-EEPROM-SPI]
extends = env:black_F407VE
build_flags = ${env:black_F407VE.build_flags} -DUSE_SPI_EEPROM -DBOARD_SCG_ECU_20
; For testing only
[env:black_F407VE-EEPROM-FRAM]
extends = env:black_F407VE
build_flags = ${env:black_F407VE.build_flags} -DFRAM_AS_EEPROM



[env:custom_monitor_speedrate]
monitor_speed = 115200

[platformio]
src_dir=speeduino
default_envs = black_F407VE-EEPROM-SPI
; local.ini is ignored via .gitignore
; This allows developers to make private/local PIO configuration changes without
; triggering Git changes in their dev tooling (E.g. VS Code)
extra_configs = local.ini

[env:native]
platform = native
build_flags =
  -DUSE_LIBDIVIDE
  -std=c++14
  -Itest/mocks
  -Itest/test_helpers
  -DNATIVE_BUILD
  -DUNIT_TEST
debug_build_flags = -std=c++14 -O0 -g3
; Ignore directories that are not actual tests, and legacy tests that don't compile
test_ignore = test_helpers, test_mocks, test_table3d_native
debug_test = test_math
build_type = debug
; Do NOT use test_build_src - causes hardware dependencies to be compiled
; test_build_src = no

[env:native_coverage]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -fprofile-arcs
  -ftest-coverage
  --coverage
  -O0
build_unflags = -O2
test_build_src = yes
extra_scripts =
debug_test = test_math
